services:
  ael-mirror:
    build:
      context: .
      dockerfile: Dockerfile.node
    environment:
      AEL_URL: "${AEL_URL:-https://ael-network.onrender.com}"
      AEL_SYNC_SOURCES: "${AEL_SYNC_SOURCES:-https://ael-network.onrender.com}"
      AEL_NODE_STATE_PATH: /data/follower-state.json
    ports:
      - "127.0.0.1:${AEL_MIRROR_PORT:-1417}:1417"
    volumes:
      - ael-mirror-state:/data
    restart: unless-stopped
volumes:
  ael-mirror-state:

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.actor
    environment:
      AEL_URL: "${AEL_URL:-https://ael-network-production.up.railway.app}"
      AEL_SYNC_SOURCES: "${AEL_SYNC_SOURCES:-https://ael-network-production.up.railway.app}"
      AEL_ROLE: worker
      AEL_AGENT_ID: "${AEL_AGENT_ID:?set AEL_AGENT_ID}"
      AEL_ACTOR_ID: "${AEL_AGENT_ID:?set AEL_AGENT_ID}"
      AEL_ACTOR_KEY: /run/secrets/agent-key.pem
    volumes:
      - "${AEL_AGENT_KEY_PATH:?set AEL_AGENT_KEY_PATH}:/run/secrets/agent-key.pem:ro"
    restart: unless-stopped
  chain-mirror:
    build:
      context: .
      dockerfile: Dockerfile.node
    environment:
      AEL_URL: "${AEL_URL:-https://ael-network-production.up.railway.app}"
      AEL_NODE_STATE_PATH: /data/follower-state.json
    volumes:
      - ael-agent-chain:/data
    ports:
      - "127.0.0.1:1417:1417"
    restart: unless-stopped
volumes:
  ael-agent-chain:

app = 'ael-network'
primary = 'sjc'

[build]

[env]
  AEL_HOST = '0.0.0.0'
  AEL_STATE = '/data/devnet-state.json'
  AEL_VALIDATORS = '4'
  AEL_SECURE_MODE = 'true'
  PORT = '1317'

[http_service]
  internal_port = 1317
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = '5s'
  interval = '10s'
  method = 'GET'
  timeout = '3s'
  path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
